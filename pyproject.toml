[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rock-world-important-assistant"
version = "0.1.0"
description = "洛克王国：世界远行商人与重要活动提醒 MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rock-assistant = "rock_world_assistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
